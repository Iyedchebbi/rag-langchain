[project]
name = "rag-langchain"
version = "0.1.0"
description = "RAG system with multi-agent chunk analysis using LangChain, DeepAgents, and OpenRouter"
readme = "README.md"
authors = [
    { name = "Iyed CHEBBI", email = "chebbiiyad@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.35",
    "dotenv>=0.9.9",
    "langchain>=1.4.9",
    "langchain-huggingface>=1.2.3",
    "langchain-openrouter>=0.2.9",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "pypdf>=7.0.1",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag-langchain = "rag_langchain:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
